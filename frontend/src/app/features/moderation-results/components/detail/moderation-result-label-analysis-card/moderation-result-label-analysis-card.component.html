<app-moderation-result-detail-card-shell title="Image label analysis">
  @if (item().moderation_labels.length) {
    <mat-tree
      [dataSource]="buildModerationLabelTree(item())"
      [childrenAccessor]="moderationLabelChildrenAccessor"
      aria-label="Rekognition labels hierarchy"
    >
      <mat-nested-tree-node *matTreeNodeDef="let node">
        <div class="moderation-tree-node">
          <mat-icon aria-hidden="true" class="text-sm section-node-icon">
            {{ node.children.length ? 'folder' : 'label' }}
          </mat-icon>
          <span class="text-sm font-semibold text-[color:var(--mat-sys-on-surface)]">
            {{ node.name }}
          </span>
          @if (node.confidence !== null) {
            <span
              class="ml-auto shrink-0 rounded-full border border-[var(--mat-sys-outline-variant)] px-2 py-0.5 text-xs font-semibold text-[color:var(--mat-sys-on-surface)]"
            >
              {{ formatConfidencePercent(node.confidence) }}
            </span>
          }
        </div>
        <div class="moderation-tree-children">
          <ng-container matTreeNodeOutlet></ng-container>
        </div>
      </mat-nested-tree-node>
    </mat-tree>
  } @else {
    <p class="m-0 text-sm text-muted">No moderation labels detected.</p>
  }
</app-moderation-result-detail-card-shell>

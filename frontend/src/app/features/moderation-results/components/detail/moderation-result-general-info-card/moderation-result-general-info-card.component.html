<app-moderation-result-detail-card-shell title="General information">
  <app-property-row icon="schedule" label="Processed at">
    {{ item().timestamp | date: 'medium' }}
  </app-property-row>

  <app-property-row icon="tag" label="Image hash">
    <span class="font-mono" [attr.title]="item().image_hash">{{ item().image_hash }}</span>
  </app-property-row>

  <app-property-row icon="photo_library" label="Image ID">
    <span class="font-mono" [attr.title]="item().image_id">{{ item().image_id }}</span>
  </app-property-row>

  <app-property-row icon="folder" label="S3 path">
    <span class="font-mono" [attr.title]="item().s3_key">{{ item().s3_key }}</span>
  </app-property-row>
</app-moderation-result-detail-card-shell>
